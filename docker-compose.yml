services:
  web:
    build: .
    container_name: lab-status
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - 8081:80
    environment:
      - NETBOX_URL
      - NETBOX_TOKEN
      - PROXMOX_URL
      - PROXMOX_TOKEN
      - CONTAINER_STATUS_URL

  api:
    build: ./backend
    container_name: lab-status-api
    restart: unless-stopped
    environment:
      - NETBOX_URL
      - NETBOX_TOKEN
      - NETBOX_PUBLIC_URL
      - ROUTEROS_HOST
      - ROUTEROS_PORT
      - ROUTEROS_USER
      - ROUTEROS_PASSWORD
      - SERVICE_CHECK_EXCLUDE
