services:
  web:
    build: .
    container_name: lab-status
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - 8081:80

  api:
    build: ./backend
    container_name: lab-status-api
    restart: unless-stopped
    environment:
      - NETBOX_URL
      - NETBOX_TOKEN
      - NETBOX_PUBLIC_URL
      - ROUTEROS_HOST
      - ROUTEROS_PORT
      - ROUTEROS_USER
      - ROUTEROS_PASSWORD
      - PROXMOX_URL
      - PROXMOX_TOKEN
      - PROXMOX_PERIOD_S
      - PROXMOX_METRICS_PERIOD_S
      - SERVICE_CHECK_EXCLUDE
      - SERVICES_PERIOD_S
      - NPM_URL
      - NPM_IDENTITY
      - NPM_SECRET
      - PORTAINER_URL
      - PORTAINER_TOKEN
      - CONTAINERS_PERIOD_S
      - INVENTORY_PERIOD_S
      - STREAM_GRACE_S
